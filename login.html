<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | JuanQueue</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .login-container {
            min-height: 100vh;
        }
        .left-panel {
            background: url('assets/barangay-background.png');
            background-size: cover;
            background-position: center;
            position: relative;
            color: white;
            overflow: hidden;
        }
        
        .left-panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(29, 78, 216, 1) 0%, rgba(30, 58, 139, 1) 100%);
            opacity: 0.7; /* 🎯 Adjust this value to control color opacity */
            z-index: 1;
            pointer-events: none;
        }
        
        .left-panel > * {
            position: relative;
            z-index: 2; /* Ensures your content stays on top */
        }
        
        
        
        
        .left-panel::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI1IiBoZWlnaHQ9IjUiPgo8cmVjdCB3aWR0aD0iNSIgaGVpZ2h0PSI1IiBmaWxsPSJ0cmFuc3BhcmVudCI+PC9yZWN0Pgo8cGF0aCBkPSJNMCA1TDUgMFpNNiA0TDQgNlpNLTEgMUwxIC0xWiIgc3Ryb2tlPSJyZ2JhKDI1NSwyNTUsMjU1LDAuMDUpIiBzdHJva2Utd2lkdGg9IjEiPjwvcGF0aD4KPC9zdmc+');
            opacity: 0.1;
            pointer-events: none;
        }
        
        @media (max-width: 768px) {
            .login-container {
                flex-direction: column;
            }
            .left-panel {
                height: 200px;
                background: 
                    linear-gradient(135deg, rgba(29, 78, 216, 0.95) 0%, rgba(30, 58, 139, 1) 100%);
            }
            .left-panel::after {
                display: none;
            }
        }
    </style>
</head>
<body class="font-poppins">
    <div class="login-container flex flex-col md:flex-row bg-gray-50">
        <!-- Left Panel (Image/Info) -->
        <div class="left-panel w-full md:w-1/2 flex items-center justify-center text-white p-8">
            <div class="max-w-md">
                <h1 class="text-3xl font-bold mb-4 text-center">JuanQueue System</h1>
                <h2 class="text-xl font-semibold mb-6 text-center">Brgy. Agapito Del Rosario</h2>
                <p class="text-center mb-6">An efficient appointment, queue, document request management system for better public service delivery.</p>
                <div class="flex justify-center space-x-4">
                    <a href="#" class="text-white hover:text-blue-300"><i class="fab fa-facebook-f"></i></a>
                    <a href="#" class="text-white hover:text-blue-300"><i class="fab fa-twitter"></i></a>
                    <a href="#" class="text-white hover:text-blue-300"><i class="fab fa-instagram"></i></a>
                </div>
            </div>
        </div>

        <!-- Right Panel (Login Form) - Refactored -->
        <div class="w-full md:w-1/2 flex flex-col justify-center p-8 md:p-12 lg:p-16">
            <div class="w-full max-w-md mx-auto">
                <!-- Logo and Header -->
                <div class="text-center mb-8">
                    <div class="flex justify-center mb-4">
                        <img src="assets/juanq_admin.png" alt="JuanQueue Logo" class="h-16 object-contain">
                    </div>
                    <h1 class="text-2xl font-bold text-gray-800">Admin Login</h1>
                    <p class="text-gray-600 mt-2">Enter your credentials to access the dashboard</p>
                </div>
                
                <!-- Login Form -->
                <form id="loginForm" class="space-y-5">
                    <div class="space-y-1">
                        <label for="username" class="block text-sm font-medium text-gray-700">Username</label>
                        <input type="text" id="username" required
                            class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition duration-200">
                    </div>
                    
                    <div class="space-y-1">
                        <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                        <input type="password" id="password" required
                            class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition duration-200">
                    </div>
                    
                    <div class="flex items-center justify-between">
                        <div class="flex items-center">
                            <input id="remember-me" name="remember-me" type="checkbox" 
                                class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded">
                            <label for="remember-me" class="ml-2 text-sm text-gray-600">Remember me</label>
                        </div>
                        <a href="#" class="text-sm font-medium text-blue-600 hover:text-blue-500 transition duration-200">
                            Forgot password?
                        </a>
                    </div>
                    
                    <button type="submit" 
                        class="w-full bg-blue-600 text-white py-2.5 px-4 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition duration-200">
                        Login
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            if(username === 'admin' && password === 'admin123') {
                window.location.href = 'admin.html';
            } else {
                alert('Invalid credentials. Try admin/admin123');
            }
        });
    </script>
</body>
</html>
